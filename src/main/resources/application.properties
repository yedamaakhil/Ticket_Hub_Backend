spring.application.name=Ticket_Booking_System
spring.config.import=optional:classpath:application-local.properties

spring.security.user.name=${SPRING_SECURITY_USER_NAME:Akhil}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:123456}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tickethub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.name=TicketHub

# Email (Brevo HTTP API)
brevo.api.key=${BREVO_API_KEY:}
brevo.from.email=${BREVO_FROM_EMAIL:tickethub.online@gmail.com}

spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5

# Razorpay
razorpay.api.key=${RAZORPAY_API_KEY:}
razorpay.api.secret=${RAZORPAY_API_SECRET:}

# Clerk JWT (optional — paste PEM public key from Clerk dashboard)
clerk.jwt.public-key=${CLERK_JWT_PUBLIC_KEY:}
clerk.secret-key=${CLERK_SECRET_KEY:}
