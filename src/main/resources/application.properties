spring.application.name=Ticket_Booking_System
spring.config.import=optional:classpath:application-local.properties

spring.security.user.name=${SPRING_SECURITY_USER_NAME:Akhil}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:123456}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tickethub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.name=TicketHub

# Email (Gmail SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_HOST:smtp.gmail.com}

spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5

# Razorpay
razorpay.api.key=${RAZORPAY_API_KEY:}
razorpay.api.secret=${RAZORPAY_API_SECRET:}

# Clerk JWT (optional — paste PEM public key from Clerk dashboard)
clerk.jwt.public-key=${CLERK_JWT_PUBLIC_KEY:}
clerk.secret-key=${CLERK_SECRET_KEY:}
