# Render Blueprint — Docker web service
# Note: Render managed DBs are PostgreSQL only. Use Railway MySQL, PlanetScale,
# or any external MySQL host and set SPRING_DATASOURCE_* env vars manually.

services:
  - type: web
    name: tickethub-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/shows/active
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: RAZORPAY_API_KEY
        sync: false
      - key: RAZORPAY_API_SECRET
        sync: false
